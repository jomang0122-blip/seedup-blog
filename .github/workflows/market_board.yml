name: SeedUP — 시장 현황판 페이지

# 블로거 고정 페이지 "시장 현황판"을 고쳐 쓴다. Anthropic API를 부르지 않는다(크레딧 0).
#   장 마감 후 칸(지수·시장 내부 체력·업종·시가총액): 국내 데일리 작업이 성공으로 끝나면 이어서
#   랩 지표 칸(지표 25개)                      : 평일 아침 07:30 KST — 전날 확정 종가로 계산
#     (오후 4시 이후엔 출처마다 오늘 종가가 다르고 시간외 값이 섞인다 — 랩 update_prices_v3·10-28 실측)
#     GitHub 자체 예약(schedule)은 쓰지 않는다 — 10-29 07:30 예약이 10:54에 돌았다(다른 발행 작업과 같은 이유)
# 설계·검증 기록: 08_블로그/02_구글_seedup/03_투자도구/04_시장현황판/_현황판_시장현황판.md

on:
  workflow_run:
    workflows: ["SeedUP — 국내증시 데일리"]
    types: [completed]
  # 랩 지표 칸: cron-job.org 에서 workflow_dispatch로 트리거 (KST 월~금 07:30)
  workflow_dispatch:
    inputs:
      part:
        description: 'daily(장 마감 후 칸) / lab(랩 지표 칸) / none(페이지만 다시 그림)'
        required: true
        default: 'lab'
        type: choice
        options: [daily, lab, none]
      publish:
        description: '블로거 페이지에 반영 (끄면 미리보기만)'
        type: boolean
        default: true

concurrency:
  group: market-board          # 두 칸이 동시에 돌아 저장소에 함께 올리다 충돌하지 않게 순서대로
  cancel-in-progress: false

jobs:
  update:
    # 국내 데일리가 실패했으면 장 마감 후 칸은 건너뛴다(그날 시장 내부 체력 기록이 없을 수 있음)
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 코드 체크아웃 (최신 main — 국내 데일리가 방금 올린 기록 포함)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 인증 파일 복원
        env:
          TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
        run: |
          echo "$TOKEN_JSON" > token.json
          echo "$CREDENTIALS_JSON" > credentials.json
          echo "$CONFIG_YAML" > config.yaml

      - name: 어느 칸을 갱신할지 결정
        id: part
        env:
          EVENT: ${{ github.event_name }}
          INPUT_PART: ${{ github.event.inputs.part }}
          INPUT_PUBLISH: ${{ github.event.inputs.publish }}
        run: |
          echo "수신된 입력값 — part=[$INPUT_PART] publish=[$INPUT_PUBLISH] (외부 트리거가 inputs를 누락하면 여기서 바로 드러남)"
          # cron-job.org 호출은 입력값이 빠져 올 수 있다 — 비어 있으면 아침 정기 실행(lab·반영)으로 본다
          case "$EVENT" in
            workflow_run) PART=daily; PUB=true ;;
            *)            PART="${INPUT_PART:-lab}"; PUB="${INPUT_PUBLISH:-true}" ;;
          esac
          echo "part=$PART" >> "$GITHUB_OUTPUT"
          echo "publish=$PUB" >> "$GITHUB_OUTPUT"
          echo "갱신 칸: $PART · 블로거 반영: $PUB (트리거 $EVENT)"

      - name: 시장 현황판 갱신
        env:
          PYTHONPATH: ${{ github.workspace }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: |
          set -o pipefail
          ARGS="--part ${{ steps.part.outputs.part }}"
          if [ "${{ steps.part.outputs.publish }}" = "true" ]; then ARGS="$ARGS --publish"; fi
          python jobs/market_board/main.py $ARGS 2>&1 | tee "$RUNNER_TEMP/publish.log"

      - name: 갱신된 token.json을 Secret에 업데이트
        if: steps.part.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: gh secret set GOOGLE_TOKEN_JSON --body "$(cat token.json)"

      - name: 현황판 자료 커밋 & 푸시
        if: steps.part.outputs.publish == 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git
          git add data/board/board_daily.json || true
          git add data/board/board_lab.json || true
          git add data/board/breadth_hist.csv || true
          git add data/board/fg_hist.csv || true
          git add data/board/page.json || true
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: 시장 현황판 갱신 ${{ steps.part.outputs.part }} $(date +'%Y%m%d')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: 실패 시 카카오톡 알림
        if: failure()
        env:
          PYTHONPATH: ${{ github.workspace }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
        run: |
          python -c "
          import os
          from shared.kakao_notify import notify_failure, extract_reason
          reason = extract_reason(os.path.join(os.environ.get('RUNNER_TEMP', ''), 'publish.log'))
          notify_failure('시장 현황판 (market_board)', '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}', reason)
          "
