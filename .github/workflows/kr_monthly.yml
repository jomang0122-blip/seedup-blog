name: SeedUP — 국내증시 월간 결산

on:
  # cron-job.org 에서 workflow_dispatch로 트리거 (KST 매월 1일 08:00 권장)
  workflow_dispatch:
    inputs:
      dry_run:
        description: '미리보기만 (발행 안 함)'
        required: false
        type: boolean
        default: false
      force:
        description: '날짜 체크·중복 체크 무시하고 강제 재발행'
        required: false
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 인증 파일 복원
        env:
          TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          echo "$TOKEN_JSON" > token.json
          echo "$CREDENTIALS_JSON" > credentials.json

      - name: .env 파일 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          echo "ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}" > .env
          echo "NAVER_CLIENT_ID=${NAVER_CLIENT_ID}" >> .env
          echo "NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}" >> .env

      - name: config.yaml 복원
        env:
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
        run: echo "$CONFIG_YAML" > config.yaml

      - name: 국내증시 월간 결산 발행
        env:
          PYTHONPATH: ${{ github.workspace }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          echo "수신된 입력값 — dry_run=[$INPUT_DRY_RUN] force=[$INPUT_FORCE] (외부 트리거가 inputs를 누락하면 여기서 바로 드러남)"
          ARGS=""
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
            echo "  → --dry-run 적용됨 (실제 발행 안 함)"
          else
            echo "  → [LIVE] 실제 발행 모드로 진행합니다"
          fi
          if [ "$INPUT_FORCE" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          # 실패 사유를 카카오톡 알림에 담기 위해 출력을 파일로도 남긴다.
          # pipefail이 없으면 tee의 성공 코드가 파이프라인 결과가 되어 실패가 성공으로 둔갑한다.
          set -o pipefail
          python jobs/kr_monthly/main.py $ARGS 2>&1 | tee "$RUNNER_TEMP/publish.log"

      - name: 갱신된 token.json을 Secret에 업데이트
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          TOKEN_CONTENT=$(cat token.json)
          gh secret set GOOGLE_TOKEN_JSON --body "$TOKEN_CONTENT"

      - name: 발행 로그 커밋 & 푸시
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git
          git add logs/*.json || true
          if git diff --staged --quiet; then
            echo "로그 변경 없음 — 커밋 생략"
          else
            git commit -m "chore: 발행 로그 업데이트 $(date +'%Y%m%d')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: 실패 시 카카오톡 알림
        if: failure()
        env:
          PYTHONPATH: ${{ github.workspace }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
        run: |
          python -c "
          import os
          from shared.kakao_notify import notify_failure, extract_reason
          reason = extract_reason(os.path.join(os.environ.get('RUNNER_TEMP', ''), 'publish.log'))
          notify_failure('국내증시 월간결산 (kr_monthly)', '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}', reason)
          "
