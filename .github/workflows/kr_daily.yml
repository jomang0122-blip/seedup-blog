name: SeedUP — 국내증시 데일리

on:
  # cron-job.org 에서 workflow_dispatch로 트리거 (KST 16:30 평일)
  # ⚠️ 16:00→16:30 변경(2026-08-23): 장마감(15:30) 직후 16:00 트리거 시
  # 지수·특징주 데이터가 아직 반영지연 상태라 발행이 자주 실패해 30분 늦춤.
  workflow_dispatch:
    inputs:
      date:
        description: '날짜 지정 (YYYYMMDD). 비워두면 오늘'
        required: false
        default: ''
      dry_run:
        description: '미리보기만 (발행 안 함)'
        required: false
        type: boolean
        default: false
      force:
        description: '중복 체크 무시하고 강제 재발행'
        required: false
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 인증 파일 복원
        env:
          TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          echo "$TOKEN_JSON" > token.json
          echo "$CREDENTIALS_JSON" > credentials.json

      - name: .env 파일 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          echo "ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}" > .env
          echo "NAVER_CLIENT_ID=${NAVER_CLIENT_ID}" >> .env
          echo "NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}" >> .env
          echo "DART_API_KEY=${DART_API_KEY}" >> .env

      - name: config.yaml 복원
        env:
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
        run: echo "$CONFIG_YAML" > config.yaml

      - name: 국내증시 데일리 발행
        env:
          PYTHONPATH: ${{ github.workspace }}
          INPUT_DATE: ${{ github.event.inputs.date }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          echo "수신된 입력값 — dry_run=[$INPUT_DRY_RUN] force=[$INPUT_FORCE] date=[$INPUT_DATE] (외부 트리거가 inputs를 누락하면 여기서 바로 드러남)"
          ARGS=""
          DATE=$(echo "$INPUT_DATE" | tr -d '[:space:]')
          if [ -n "$DATE" ]; then
            ARGS="$ARGS --date $DATE"
          fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
            echo "  → --dry-run 적용됨 (실제 발행 안 함)"
          else
            echo "  → [LIVE] 실제 발행 모드로 진행합니다"
          fi
          if [ "$INPUT_FORCE" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          python jobs/kr_daily/main.py $ARGS

      - name: 갱신된 token.json을 Secret에 업데이트
        if: github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          TOKEN_CONTENT=$(cat token.json)
          gh secret set GOOGLE_TOKEN_JSON --body "$TOKEN_CONTENT"

      - name: 발행 로그 커밋 & 푸시
        if: github.event.inputs.dry_run != 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git
          git add logs/*.json || true
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: 발행 로그 업데이트 $(date +'%Y%m%d')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: 실패 시 카카오톡 알림
        if: failure()
        env:
          PYTHONPATH: ${{ github.workspace }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
        run: |
          python -c "
          from shared.kakao_notify import notify_failure
          notify_failure('국내증시 데일리 (kr_daily)', '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}')
          "
